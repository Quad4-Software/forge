# Coolify-ready Quad4 Forge + RavenGuard edge (hardened)
# Docs: https://coolify.io/docs/knowledge-base/docker/compose
# RavenGuard: https://github.com/Quad4-Software/ravenguard
#
# Coolify only proxies one public HTTP service. Put the domain on ravenguard
# (SERVICE_URL_RAVENGUARD_8080). Forge HTTP stays private on the compose network.
# Forge ROOT_URL/DOMAIN reuse the RavenGuard public URL for correct links.
# Cache/session/queue: Valkey over TLS with password auth.
# Postgres requires TLS for all network connections (internal CA via pki-init).
# Required secrets: FORGE_DB_PASSWORD, VALKEY_PASSWORD, RG_CHALLENGE_SECRET
#
# All persistent paths use named volumes (Coolify prefixes them). No host bind
# mounts, so Coolify cannot turn missing file paths into directories.

name: quad4-forge

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  # One-shot internal PKI: issues a CA plus server certs for db and valkey.
  # The CA private key stays in the container's tmpfs and is never persisted.
  # The valkey image ships the openssl CLI, so no extra image is needed.
  pki-init:
    image: docker.io/valkey/valkey:8-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
    restart: "no"
    user: "0:0"
    <<: *security
    read_only: true
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    volumes:
      - forge-pki:/pki
      - forge-ca:/ca
    tmpfs:
      - /tmp:size=8m,mode=1777
    command:
      - sh
      - -c
      - |
        set -e
        if [ -s /pki/ca.crt ] && [ -s /pki/db.key ] && [ -s /pki/valkey.key ]; then
          echo "pki already provisioned"
          exit 0
        fi
        openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes \
          -subj "/CN=quad4-internal-ca" \
          -keyout /tmp/ca.key -out /tmp/ca.crt
        for svc in db valkey; do
          openssl req -newkey rsa:2048 -nodes -subj "/CN=$$svc" \
            -keyout /tmp/$$svc.key -out /tmp/$$svc.csr
          printf 'subjectAltName=DNS:%s\n' "$$svc" > /tmp/$$svc.ext
          openssl x509 -req -in /tmp/$$svc.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key \
            -CAcreateserial -days 3650 -sha256 -extfile /tmp/$$svc.ext -out /tmp/$$svc.crt
        done
        chmod 0644 /tmp/ca.crt /tmp/db.crt /tmp/valkey.crt
        chmod 0600 /tmp/db.key /tmp/valkey.key
        chown 70:70 /tmp/db.key
        chown 999:1000 /tmp/valkey.key
        mv /tmp/db.crt /tmp/db.key /tmp/valkey.crt /tmp/valkey.key /tmp/ca.crt /pki/
        cp /pki/ca.crt /ca/ca.crt
        printf 'local   all   all                            trust\nhostssl all   all   0.0.0.0/0      scram-sha-256\nhostssl all   all   ::/0           scram-sha-256\n' > /pki/pg_hba.conf
        chmod 0644 /pki/pg_hba.conf
        rm -f /tmp/ca.key /tmp/*.csr /tmp/*.ext
        echo "pki provisioned"

  db:
    # PG 18 image keeps data under /var/lib/postgresql/18/docker, so the
    # volume mounts the parent dir.
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    <<: *security
    read_only: false
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${FORGE_DB_NAME:-forgejo}
      POSTGRES_USER: ${FORGE_DB_USER:-forgejo}
      POSTGRES_PASSWORD: ${FORGE_DB_PASSWORD:?}
    # TLS required for all network connections (custom pg_hba.conf is
    # hostssl-only, scram-sha-256); local socket stays trust for init
    # and healthchecks.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/db.crt
      - -c
      - ssl_key_file=/pki/db.key
      - -c
      - ssl_ca_file=/pki/ca.crt
      - -c
      - hba_file=/pki/pg_hba.conf
    volumes:
      - forge-db:/var/lib/postgresql
      - forge-pki:/pki:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=0775,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  valkey:
    image: docker.io/valkey/valkey:8-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
    restart: unless-stopped
    user: "999:1000"
    <<: *security
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    # TLS only (no plaintext port), password auth on the default user.
    command:
      - valkey-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /pki/valkey.crt
      - --tls-key-file
      - /pki/valkey.key
      - --tls-ca-cert-file
      - /pki/ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - ${VALKEY_PASSWORD:?}
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --protected-mode
      - "no"
      - --bind
      - "0.0.0.0"
    volumes:
      - forge-valkey:/data
      - forge-pki:/pki:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --tls --cacert /pki/ca.crt --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  forge:
    image: ${FORGE_IMAGE:-ghcr.io/quad4-software/forge-rootless:dev}
    restart: unless-stopped
    user: "1000:1000"
    <<: *security
    read_only: false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__APP_NAME: ${APP_NAME:-Quad4 Forge}
      FORGEJO__APP_SLOGAN: ${APP_SLOGAN:-Coffee. Code. Forge.}
      # Public host comes from RavenGuard's Coolify domain (edge only).
      FORGEJO__server__DOMAIN: ${SERVICE_FQDN_RAVENGUARD}
      FORGEJO__server__ROOT_URL: ${SERVICE_URL_RAVENGUARD_8080}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: ${SSH_PORT:-49393}
      FORGEJO__server__START_SSH_SERVER: ${START_SSH_SERVER:-true}
      FORGEJO__server__REVERSE_PROXY_LIMIT: "1"
      FORGEJO__server__REVERSE_PROXY_TRUSTED_PROXIES: "ravenguard,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: ${FORGE_DB_NAME:-forgejo}
      FORGEJO__database__USER: ${FORGE_DB_USER:-forgejo}
      FORGEJO__database__PASSWD: ${FORGE_DB_PASSWORD:?}
      FORGEJO__database__SSL_MODE: verify-full
      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: rediss://default:${VALKEY_PASSWORD:?}@valkey:6379/0
      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: rediss://default:${VALKEY_PASSWORD:?}@valkey:6379/1
      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: rediss://default:${VALKEY_PASSWORD:?}@valkey:6379/2
      # Internal CA for db/valkey TLS verification alongside the public CAs.
      SSL_CERT_DIR: /etc/ssl/certs:/pki
      FORGEJO__metrics__ENABLED: ${METRICS_ENABLED:-true}
      # No app-level captcha: RavenGuard edge is the bot/abuse layer.
      FORGEJO__service__ENABLE_CAPTCHA: "false"
      FORGEJO__sentry__ENABLED: ${SENTRY_ENABLED:-false}
      FORGEJO__sentry__DSN: ${SENTRY_DSN:-}
      FORGEJO__sentry__FRONTEND_DSN: ${SENTRY_FRONTEND_DSN:-}
      FORGEJO__sentry__ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      FORGEJO__ui__DEFAULT_THEME: quad4-dark
      FORGEJO__rns__ENABLED: ${RNS_ENABLED:-true}
      FORGEJO__rns__EMAIL_OPTIONAL: ${RNS_EMAIL_OPTIONAL:-true}
      # Built-in LFS server, objects persist in forge-data volume at data/lfs.
      FORGEJO__server__LFS_START_SERVER: ${LFS_ENABLED:-true}
      FORGEJO__server__LFS_MAX_FILE_SIZE: ${LFS_MAX_FILE_SIZE:-0}
    volumes:
      - forge-data:/var/lib/gitea
      - forge-ca:/pki:ro
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=1000,gid=1000
      - /var/tmp:size=64m,mode=1777,uid=1000,gid=1000
    expose:
      - "3000"
    ports:
      - "${SSH_HOST_PORT:-49393}:2222"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  ravenguard-config-init:
    image: ${RAVENGUARD_CONFIG_IMAGE:-ghcr.io/quad4-software/forge-ravenguard-config:dev}
    restart: "no"
    user: "0:0"
    volumes:
      - ravenguard-config:/config

  ravenguard:
    image: ${RAVENGUARD_IMAGE:-ghcr.io/quad4-software/ravenguard:edge}
    restart: unless-stopped
    user: "65532:65532"
    <<: *security
    # Default mode is "all" (standalone edge). Do not use "proxy" (hub-agent fleet mode).
    command: ["-config", "/config/ravenguard.coolify.toml"]
    depends_on:
      ravenguard-config-init:
        condition: service_completed_successfully
      forge:
        condition: service_healthy
    environment:
      # Coolify magic: domain attaches to this service on container port 8080.
      SERVICE_URL_RAVENGUARD_8080: ${SERVICE_URL_RAVENGUARD_8080}
      SERVICE_FQDN_RAVENGUARD: ${SERVICE_FQDN_RAVENGUARD}
      RG_SANDBOX_MODE: ${RG_SANDBOX_MODE:-best_effort}
      RG_CHALLENGE_SECRET: ${RG_CHALLENGE_SECRET:?}
      RG_TLS_MODE: "off"
      RG_ADMIN_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ravenguard-config:/config:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=32m,mode=1777
    expose:
      - "8080"

volumes:
  forge-data:
  forge-db:
  forge-valkey:
  forge-pki:
  forge-ca:
  ravenguard-config:
