# Coolify-ready Quad4 Forge + RavenGuard proxy (hardened)
# Docs: https://coolify.io/docs/knowledge-base/docker/compose
# RavenGuard: https://github.com/Quad4-Software/ravenguard
#
# Assign a domain to service "ravenguard" (container port 8080).
# Forge HTTP stays private; SSH may use host port mapping.
# Required: FORGE_DB_PASSWORD, ALTCHA_HMAC_KEY, RG_CHALLENGE_SECRET

name: quad4-forge

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  db:
    image: docker.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    <<: *security
    read_only: false
    environment:
      POSTGRES_DB: ${FORGE_DB_NAME:-forgejo}
      POSTGRES_USER: ${FORGE_DB_USER:-forgejo}
      POSTGRES_PASSWORD: ${FORGE_DB_PASSWORD:?}
    volumes:
      - type: bind
        source: ./data/forge-db
        target: /var/lib/postgresql/data
        is_directory: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  redis:
    image: docker.io/library/redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    user: "999:999"
    <<: *security
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --protected-mode
      - "yes"
      - --bind
      - "0.0.0.0"
    volumes:
      - type: bind
        source: ./data/forge-redis
        target: /data
        is_directory: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 32M

  forge:
    image: ${FORGE_IMAGE:-ghcr.io/quad4-software/forge-rootless:latest}
    restart: unless-stopped
    user: "1000:1000"
    <<: *security
    read_only: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # Public URL is RavenGuard's Coolify URL
      SERVICE_URL_RAVENGUARD_8080: ${SERVICE_URL_RAVENGUARD_8080}
      FORGEJO__APP_NAME: ${APP_NAME:-Quad4 Forge}
      FORGEJO__APP_SLOGAN: ${APP_SLOGAN:-Charcoal. Code. Forge.}
      FORGEJO__server__DOMAIN: ${SERVICE_FQDN_RAVENGUARD}
      FORGEJO__server__ROOT_URL: ${SERVICE_URL_RAVENGUARD_8080}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: ${SSH_PORT:-2222}
      FORGEJO__server__START_SSH_SERVER: ${START_SSH_SERVER:-false}
      FORGEJO__server__REVERSE_PROXY_LIMIT: "1"
      FORGEJO__server__REVERSE_PROXY_TRUSTED_PROXIES: "*"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: ${FORGE_DB_NAME:-forgejo}
      FORGEJO__database__USER: ${FORGE_DB_USER:-forgejo}
      FORGEJO__database__PASSWD: ${FORGE_DB_PASSWORD:?}
      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://redis:6379/0
      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://redis:6379/1
      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://redis:6379/2
      FORGEJO__metrics__ENABLED: ${METRICS_ENABLED:-true}
      FORGEJO__service__ENABLE_CAPTCHA: "true"
      FORGEJO__service__CAPTCHA_TYPE: altcha
      FORGEJO__service__REQUIRE_CAPTCHA_FOR_LOGIN: ${REQUIRE_CAPTCHA_FOR_LOGIN:-false}
      FORGEJO__service__ALTCHA_MODE: embedded
      FORGEJO__service__ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?}
      FORGEJO__service__ALTCHA_VERIFY_MODE: solution
      FORGEJO__service__ALTCHA_MAX_NUMBER: ${ALTCHA_MAX_NUMBER:-100000}
      FORGEJO__sentry__ENABLED: ${SENTRY_ENABLED:-false}
      FORGEJO__sentry__DSN: ${SENTRY_DSN:-}
      FORGEJO__sentry__FRONTEND_DSN: ${SENTRY_FRONTEND_DSN:-}
      FORGEJO__sentry__ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      FORGEJO__ui__DEFAULT_THEME: quad4-dark
    volumes:
      - type: bind
        source: ./data/forge
        target: /var/lib/gitea
        is_directory: true
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=1000,gid=1000
      - /var/tmp:size=64m,mode=1777,uid=1000,gid=1000
    ports:
      - "${SSH_HOST_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  ravenguard:
    image: ${RAVENGUARD_IMAGE:-ghcr.io/quad4-software/ravenguard:edge}
    restart: unless-stopped
    user: "65532:65532"
    <<: *security
    command: ["proxy", "-config", "/config/ravenguard.toml"]
    depends_on:
      forge:
        condition: service_healthy
    environment:
      SERVICE_URL_RAVENGUARD_8080: ${SERVICE_URL_RAVENGUARD_8080}
      RG_SANDBOX_MODE: ${RG_SANDBOX_MODE:-best_effort}
      RG_CHALLENGE_SECRET: ${RG_CHALLENGE_SECRET:?}
      RG_TLS_MODE: "off"
      RG_ADMIN_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - type: bind
        source: ./deploy/ravenguard/ravenguard.toml
        target: /config/ravenguard.toml
      - type: bind
        source: ./deploy/ravenguard/blocklists
        target: /blocklists
        is_directory: true
      - type: bind
        source: ./deploy/ravenguard/seccomp-ravenguard.json
        target: /etc/ravenguard/seccomp.json
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/ravenguard/seccomp-ravenguard.json
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M
