# Quad4 Forge QA — page-matrix accessibility scans plus Lighthouse CI audits.
# Runs axe-core over seeded pages in light and dark themes, then Lighthouse
# against the public page set. Reports stay on the runner filesystem.

name: qa

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  page-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: make deps-frontend

      - name: Build frontend
        run: make frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility page matrix
        run: make test-qa

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lhci-reports
          path: tests/e2e/reports/lhci
          if-no-files-found: ignore
          retention-days: 14
